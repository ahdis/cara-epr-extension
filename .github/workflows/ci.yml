name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test test/*.test.mjs
      - name: Install Playwright (offline end-to-end test)
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Offline end-to-end test (fake portal + fake API)
        run: node test/e2e/fake-portal.mjs
      - name: Verify manifest permissions are minimal
        run: |
          node -e '
            const m = require("./manifest.json");
            const perms = m.permissions.sort().join(",");
            if (perms !== "downloads,sidePanel,storage") throw new Error("unexpected permissions: " + perms);
            if (m.host_permissions.join(",") !== "https://patient.cara.ch/*") throw new Error("unexpected host permissions");
            if (!/default-src .self./.test(m.content_security_policy.extension_pages)) throw new Error("CSP missing");
            console.log("manifest ok");
          '

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest version
        run: |
          v=$(node -p 'require("./manifest.json").version')
          [ "refs/tags/v$v" = "$GITHUB_REF" ] || { echo "tag $GITHUB_REF != manifest $v"; exit 1; }
      - name: "Build zip (no build step, the zip is the repository content)"
        run: |
          v=$(node -p 'require("./manifest.json").version')
          mkdir -p dist
          zip -r "dist/cara-transfer-$v.zip" manifest.json src _locales icons LICENSE -x '*.DS_Store'
          (cd dist && sha256sum "cara-transfer-$v.zip" > "cara-transfer-$v.zip.sha256")
          cat dist/*.sha256
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          body: |
            Built from commit ${{ github.sha }} without a build step. Verify: unzip and diff against the tagged source.
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.zip

  # Uploads the release zip to the Chrome Web Store as a draft. It never calls :publish, so the
  # submission for review stays a manual click in the developer dashboard. Authenticates as
  # cws-publisher@ahdis-ch via Workload Identity Federation (pool cws-release, which only accepts
  # v* tags of ahdis/cara-epr-extension); no key file. Skipped while the repo variables are unset.
  webstore:
    if: startsWith(github.ref, 'refs/tags/v') && vars.CWS_EXTENSION_ID != ''
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Upload to the Chrome Web Store (draft, not submitted)
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          ITEM: publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          api=https://chromewebstore.googleapis.com
          r=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/zip" \
            --data-binary "@dist/cara-transfer-$v.zip" "$api/upload/v2/$ITEM:upload?uploadType=media")
          echo "$r"
          state=$(jq -r .uploadState <<<"$r")
          for i in $(seq 1 30); do
            [ "$state" = IN_PROGRESS ] || break
            sleep 10
            r=$(curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" "$api/v2/$ITEM:fetchStatus")
            state=$(jq -r .lastAsyncUploadState <<<"$r")
            echo "upload state: $state"
          done
          [ "$state" = SUCCEEDED ] || { echo "upload not successful: $state"; exit 1; }
          echo "cara-transfer $v uploaded as draft; submit it for review in the developer dashboard."
